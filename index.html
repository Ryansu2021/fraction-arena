<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>分數森林・雙人雷射對戰</title><script>window.MathJax={tex:{inlineMath:[['\\(','\\)']]},startup:{ready:()=>{MathJax.startup.defaultReady();window.mathReady=true;}}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script><link rel="stylesheet" href="style.css"></head><body>
<header><a class="brand" href="./">✳ 分數森林 <small>雙人雷射對戰</small></a><div class="tools"><button id="sound">♫ 音效開</button><button id="settings">⚙ 遊戲設定</button></div></header>

<dialog id="setup"><form method="dialog" id="setupForm"><div class="leaf">✳</div><p class="eyebrow">歡迎來到分數森林</p><h1>算得準，<br>就能贏下這一場。</h1><p class="intro">找一位夥伴，選好難度，讓你的小動物出擊！</p><fieldset><legend>選擇難度</legend><div class="choices"><label><input type="radio" name="difficulty" value="easy" checked><span>簡單<small>小數字・基礎練習</small></span></label><label><input type="radio" name="difficulty" value="medium"><span>中等<small>異分母・進階運算</small></span></label><label><input type="radio" name="difficulty" value="hard"><span>困難<small>負分數・多步驟</small></span></label></div></fieldset><fieldset><legend>練習主題</legend><select name="topic"><option value="all">全部混合練習</option><option value="simple">判斷最簡分數</option><option value="add">分數加減運算</option><option value="multiply">分數乘除運算</option><option value="mixed">分數四則混合運算</option></select></fieldset><fieldset><legend>遊玩方式</legend><div class="choices modes"><label><input type="radio" name="mode" value="normal" checked><span>▣ 觸屏／電腦<small>兩人並排，正向顯示</small></span></label><label><input type="radio" name="mode" value="tablet"><span>▱ 平板面對面<small>左側 ↻ 90°　右側 ↺ 90°</small></span></label></div></fieldset><p class="hint">每人 7 滴血。答對發射雷射、灑落花瓣，答錯扣自己的血。<br>攻擊時全螢幕會在 0.5 秒內柔和閃動 3 次。</p><button class="start" type="submit">開始對戰 <span>↗</span></button><p id="loadStatus" class="hint">數學公式由 MathJax 顯示，首次開啟需要網路。</p></form></dialog>
<dialog id="result"><div class="winnerAnimal"></div><p class="eyebrow">森林冠軍誕生</p><h1 id="winner"></h1><p id="summary"></p><button class="start" id="again">再戰一場 ↗</button><button id="reconfigure">重新選擇難度</button></dialog>
